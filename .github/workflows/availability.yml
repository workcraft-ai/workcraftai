name: Availability monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-endpoints:
    name: Check public site and app health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check marketing website
        run: |
          status=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 3 https://workcraftai.com/)
          echo "Marketing site HTTP status: ${status}"
          [[ "$status" =~ ^2[0-9][0-9]$ ]]

      - name: Check app and Supabase Auth health
        run: |
          status=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 2 --retry-delay 3 https://app.workcraftai.com/api/health)
          echo "App health HTTP status: ${status}"
          [[ "$status" == "200" ]]
