name: Availability monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-endpoints:
    name: Check public site and app health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record availability scheduler heartbeat
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the repository CRON_SECRET to match Vercel Production. Monitor heartbeat cannot be recorded."
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 --request POST --header "Authorization: Bearer $CRON_SECRET" https://app.workcraftai.com/api/cron/monitor-heartbeat)
          echo "Availability scheduler heartbeat HTTP status: ${status}"
          [[ "$status" == "200" ]]

      - name: Check marketing website
        if: ${{ always() }}
        run: |
          status=$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 --retry 4 --retry-delay 3 --retry-all-errors https://workcraftai.com/)
          echo "Marketing site HTTP status: ${status}"
          [[ "$status" =~ ^2[0-9][0-9]$ ]]

      - name: Check app and Supabase Auth health
        if: ${{ always() }}
        run: |
          body="$RUNNER_TEMP/workcraft-app-health.json"
          for attempt in 1 2 3; do
            if status=$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 20 https://app.workcraftai.com/api/health); then
              echo "App health HTTP status: ${status} (attempt ${attempt}/3)"
              [[ "$status" == "200" ]] && exit 0
              [[ "$status" =~ ^5[0-9]{2}$ ]] || break
            else
              result=$?
              echo "::warning::App health request failed with curl exit ${result} (attempt ${attempt}/3)."
            fi
            [[ "$attempt" -eq 3 ]] || sleep 3
          done
          [[ ! -s "$body" ]] || cat "$body"
          exit 1

      - name: Retry queued transactional notifications
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the repository CRON_SECRET to match Vercel Production. Notification retries are not scheduled without it."
            exit 1
          fi
          for attempt in 1 2; do
            if status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 55 --header "Authorization: Bearer $CRON_SECRET" https://app.workcraftai.com/api/cron/notifications); then
              :
            else
              status="000"
            fi
            echo "Notification retry HTTP status: ${status} (attempt ${attempt}/2)"
            [[ "$status" == "200" ]] && exit 0
            if [[ "$attempt" -eq 1 ]] && { [[ "$status" =~ ^5[0-9]{2}$ ]] || [[ "$status" == "000" || "$status" == "408" || "$status" == "429" ]]; }; then
              echo "::warning::Notification retry returned a transient failure; retrying once after 8 seconds."
              sleep 8
              continue
            fi
            exit 1
          done

      - name: Retry queued Stripe webhooks
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the repository CRON_SECRET to match Vercel Production. Stripe retries are not scheduled without it."
            exit 1
          fi
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 55 --header "Authorization: Bearer $CRON_SECRET" https://app.workcraftai.com/api/cron/stripe-webhooks)
          echo "Stripe worker HTTP status: ${status}"
          [[ "$status" == "200" ]]

      - name: Check webhook, notification, and provider signals
        if: ${{ always() }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "$CRON_SECRET" ]]; then
            echo "::error::Set the repository CRON_SECRET to match Vercel Production. Operational checks cannot run without it."
            exit 1
          fi
          body="$RUNNER_TEMP/workcraft-operations-check.json"
          status=$(curl --silent --show-error --output "$body" --write-out '%{http_code}' --max-time 25 --header "Authorization: Bearer $CRON_SECRET" https://app.workcraftai.com/api/cron/operations-check)
          cat "$body"
          echo "Operational check HTTP status: ${status}"
          [[ "$status" == "200" ]]
