name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-secret placeholders for build-time public configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: https://example.com
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # The full audit currently flags GHSA-vfj7-8cjw-p6xm in braces@3.0.3,
      # pulled in only by eslint-config-next. GitHub lists no patched version yet.
      # Keep reporting the full tree while the production dependency audit gates releases.
      - name: Report full dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  database-security:
    name: Supabase database security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.119.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Run database security tests
        run: supabase test db

      - name: Verify atomic free estimate limit under concurrency
        run: npm run test:db:quota-concurrency

      - name: Verify atomic AI generation limit under concurrency
        run: npm run test:db:ai-quota-concurrency

      - name: Verify Pro checkout reservation under concurrency
        run: npm run test:db:pro-checkout-concurrency

      - name: Verify global app email quota under concurrency
        run: npm run test:db:email-quota-concurrency
